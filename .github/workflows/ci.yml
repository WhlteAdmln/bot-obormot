name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run pre-commit
        run: pre-commit run --all-files

  test:
    name: Tests (py${{ matrix.python-version }}, ${{ matrix.deps }})
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        deps: [lock]
        experimental: [false]
        include:
          - python-version: "3.13"
            deps: latest
            experimental: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install pinned dependencies
        if: matrix.deps == 'lock'
        run: python -m pip install -r requirements-dev.txt

      - name: Install latest allowed dependencies
        if: matrix.deps == 'latest'
        run: |
          python -m pip install \
            -r requirements.txt \
            pytest \
            pytest-asyncio \
            pytest-cov \
            packaging

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run tests with coverage
        run: |
          set -o pipefail
          python -m pytest -q -rs \
            --cov=bot \
            --cov-branch \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=junit.xml | tee pytest.log

          if grep -qE '^SKIPPED([[:space:]]|$)' pytest.log; then
            echo "::error::В обычном прогоне не должно быть пропущенных тестов"
            exit 1
          fi

      - name: Add coverage summary
        if: matrix.deps == 'lock' && matrix.python-version == '3.12'
        run: |
          {
            echo "### Coverage report (Python 3.12, locked dependencies)"
            echo '```text'
            python -m coverage report --skip-covered
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always() && matrix.deps == 'lock' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
            junit.xml
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name != 'schedule' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.10.1"

      - name: Audit locked dependencies
        run: pip-audit -r requirements-lock.txt

  build:
    name: Build release archive
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build ZIP and checksum
        run: bash scripts/build_release.sh "ci-${GITHUB_SHA::7}"

      - name: Upload release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archive
          path: dist/
          retention-days: 7

  docker-build:
    name: Docker image build (amd64 + arm64)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
