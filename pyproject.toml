[project]
name = "bot-obormot"
version = "0.1.1"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.20,<4.0",
    "aiohttp>=3.11,<4.0",
    "aiosqlite>=0.21,<1.0",
    "python-dotenv>=1.0,<2.0",
    "Pillow>=13.0.0,<14.0.0",
    "rlottie-python>=1.3.8,<2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config -ra"
filterwarnings = ["error"]
timeout = 30
markers = [
    "unit: isolated unit tests",
    "integration: requires an external service or infrastructure (e.g. a local LLM server)",
    "contract: verifies compatibility with external interfaces",
    "e2e: exercises complete application workflows",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["data", "tmp", "models"]
namespace-packages = ["scripts", "tests/contract"]

[tool.ruff.lint]
select = ["ALL"]
allowed-confusables = ["×", "А", "В", "Е", "К", "Н", "О", "С", "У", "а", "б", "г", "е", "о", "р", "с", "у", "х", "ℹ"]
ignore = ["COM812", "ISC001", "D203", "D213", "TD002", "TD003", "FIX002"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 40
max-branches = 12

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101", "SLF001"]

[tool.coverage.run]
branch = true
source = ["bot"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 81
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", '\.\.\.']

[tool.deptry]
known_first_party = ["bot"]
extend_exclude = ["scripts"]

[tool.deptry.per_rule_ignores]
DEP002 = ["rlottie-python"]

[tool.vulture]
paths = ["bot", "scripts/vulture_whitelist.py"]
min_confidence = 80

[tool.importlinter]
root_package = "bot"

[[tool.importlinter.contracts]]
name = "Handlers depend only on supported application layers"
type = "forbidden"
source_modules = ["bot.handlers"]
forbidden_modules = ["bot.app", "bot.middlewares", "bot.utils"]
allow_indirect_imports = true
ignore_imports = [
    "bot.handlers.admin.handler -> bot.utils.audit",
    "bot.handlers.history.limits -> bot.utils.audit",
]

[[tool.importlinter.contracts]]
name = "Services do not depend on handlers or middlewares"
type = "forbidden"
source_modules = ["bot.services"]
forbidden_modules = ["bot.handlers", "bot.middlewares"]

[[tool.importlinter.contracts]]
name = "Config is independent of application packages"
type = "forbidden"
source_modules = ["bot.config"]
forbidden_modules = [
    "bot.app",
    "bot.handlers",
    "bot.middlewares",
    "bot.services",
    "bot.fsm",
    "bot.utils",
]

[[tool.importlinter.contracts]]
name = "Errors are independent of application packages"
type = "forbidden"
source_modules = ["bot.errors"]
forbidden_modules = [
    "bot.app",
    "bot.handlers",
    "bot.middlewares",
    "bot.services",
    "bot.fsm",
    "bot.utils",
]

[[tool.importlinter.contracts]]
name = "Database does not depend on LLM services"
type = "forbidden"
source_modules = ["bot.services.database"]
forbidden_modules = ["bot.services.llm"]
