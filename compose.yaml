# Copy .env.example to .env and fill in BOT_TOKEN and SUPERVISOR_ID before running.
# The SQLite database and downloaded images live in the bot_obormot_data volume.
services:
  bot-obormot:
    image: ${BOT_OBORMOT_IMAGE:-ghcr.io/whlteadmln/bot-obormot:latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      BOT_OBORMOT_HOME: /data
      DATABASE_PATH: /data/bot.db
    volumes:
      - bot_obormot_data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${BOT_OBORMOT_CPU_LIMIT:-2.0}"
          memory: "${BOT_OBORMOT_MEMORY_LIMIT:-1G}"
          pids: 256

volumes:
  bot_obormot_data:
