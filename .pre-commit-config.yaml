# VENDORED: keep identical in bot-obormot and audiodoc. Source of truth: audiodoc.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--enforce-all"]
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: detect-private-key

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--config=.codespell"]

  - repo: https://github.com/kjanat/actionlint
    rev: v1.17.1
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-d", "relaxed"]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        language_version: "22.14.0"

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.27
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-dependabot
      - id: check-github-workflows

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: ["-d", "-i", "0"]

  - repo: local
    hooks:
      - id: ruff
        name: Ruff check
        entry: python -m ruff check .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: Ruff format check
        entry: python -m ruff format --check .
        language: system
        types: [python]
        pass_filenames: false

      - id: check-lock
        name: Check runtime requirements lock
        entry: python scripts/check_lock.py
        language: system
        files: ^(requirements\.txt|requirements-lock\.txt|scripts/check_lock\.py)$
        pass_filenames: false

      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: system
        types: [shell]
