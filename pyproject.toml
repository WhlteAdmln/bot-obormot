[project]
name = "bot-obormot"
version = "0.1.1"
requires-python = ">=3.11"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr"]

# DEBT: remove module overrides as strict typing errors are fixed.
[[tool.mypy.overrides]]
module = [
    "bot.handlers.admin.handler",
    "bot.handlers.chat.handler",
    "bot.handlers.fallback.handler",
    "bot.handlers.history.basic",
    "bot.handlers.history.limits",
    "bot.handlers.prompt.handler",
    "bot.handlers.start.handler",
    "bot.middlewares.temporary_messages.middleware",
    "bot.services.chat.input.audio_part",
    "bot.services.chat.input.document_part",
    "bot.services.chat.input.media_part",
    "bot.services.chat.input.prepare",
    "bot.services.chat.input.saved_text",
    "bot.services.chat.input.user_content",
    "bot.services.database.facade",
    "bot.services.telegram.chat_action",
    "bot.services.telegram.downloader",
]
ignore_errors = true

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["data", "tmp", "models"]
namespace-packages = ["scripts", "tests/contract"]

[tool.ruff.lint]
select = ["ALL"]
# Cyrillic letters that look like Latin ones. User-facing texts, docstrings and
# comments of this project are written in Russian, so these are legitimate.
allowed-confusables = ["×", "А", "В", "Е", "К", "Н", "О", "С", "У", "а", "б", "г", "е", "о", "р", "с", "у", "х", "ℹ"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "TD002",
    "TD003",
    "FIX002",
    "FBT",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 40
max-branches = 12

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "ANN", "D", "SLF001", "ARG"]

# DEBT: remove
"bot/services/chat/formatting/splitter.py" = ["C901", "PLR0912", "PLR0915"]
"bot/services/chat/input/user_content.py" = ["PLR0913"]
"bot/services/chat/streaming/delivery.py" = ["PLR0913"]
"bot/services/chat/streaming/responder.py" = ["C901", "PLR0911", "PLR0913"]
"bot/services/database/usecases/cleanup.py" = ["C901", "PLR0915"]
"bot/services/database/usecases/exchange.py" = ["C901", "PLR0913"]
"bot/services/database/usecases/history.py" = ["C901", "PLR0915"]
"bot/services/media/pipeline.py" = ["PLR0913"]
"tests/test_chat_handler.py" = ["C901", "PLR0915"]

[tool.coverage.run]
branch = true
source = ["bot"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 81
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '\.\.\.',
]
