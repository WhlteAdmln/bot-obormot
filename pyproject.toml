# VENDORED: keep identical in bot-obormot and audiodoc. Source of truth: audiodoc.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-obormot"
version = "0.2.2"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiogram>=3.20,<4.0",
    "aiohttp>=3.11,<4.0",
    "aiosqlite>=0.21,<1.0",
    "python-dotenv>=1.0,<2.0",
    "Pillow>=13.0.0,<14.0.0",
]

[project.optional-dependencies]
tgs = ["rlottie-python>=1.3.8,<2.0.0"]
dev = [
    "hypothesis==6.170.15",
    "pytest==9.2.0",
    "jsonschema==4.26.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "pytest-randomly==5.1.0",
    "pytest-timeout==2.4.0",
    "ruff==0.17.5",
    "deptry==0.25.1",
    "import-linter==2.16",
    "vulture==2.16",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "shfmt-py==4.2.0",
    "shellcheck-py==0.11.0.1",
    "pre-commit==4.7.0",
    "packaging==26.3",
    "build>=1.6.1,<2.0",
    "setuptools==84.2.1",
    "wheel==0.48.0",
]

[project.scripts]
bot-obormot = "bot_obormot.cli:main"

[tool.setuptools.packages.find]
include = ["bot_obormot*", "bot"]

[tool.setuptools.package-data]
bot_obormot = ["prompts/*.md", "templates/env.example"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config -ra"
filterwarnings = ["error"]
timeout = 30
markers = [
    "unit: isolated unit tests",
    "integration: requires an external service or infrastructure (e.g. a local LLM server)",
    "contract: verifies compatibility with external interfaces",
    "e2e: exercises complete application workflows",
]

[tool.mypy]
mypy_path = "typings"
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr"]

# odfpy does not provide type information.
[[tool.mypy.overrides]]
module = ["odf", "odf.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["data", "tmp", "models", "build"]
namespace-packages = ["scripts", "tests/contract", "tests/integration", "tests/unit"]

[tool.ruff.lint]
select = ["ALL"]
allowed-confusables = ["×", "А", "В", "Е", "К", "Н", "О", "С", "У", "а", "б", "г", "е", "о", "р", "с", "у", "х", "ℹ"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "TD002",
    "TD003",
    "FIX002",
    "FBT",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 40
max-branches = 12

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "ANN", "D", "SLF001", "ARG"]


[tool.coverage.run]
branch = true
source = ["bot_obormot"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 92.1
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", '\.\.\.']

[tool.deptry]
optional_dependencies_dev_groups = ["dev"]
known_first_party = ["bot_obormot", "bot"]
extend_exclude = ["scripts"]

[tool.deptry.per_rule_ignores]
DEP002 = ["rlottie-python"]

[tool.vulture]
paths = ["bot_obormot", "scripts/vulture_whitelist.py"]
min_confidence = 80

[tool.importlinter]
root_package = "bot_obormot"

[[tool.importlinter.contracts]]
name = "Handlers depend only on supported application layers"
type = "forbidden"
source_modules = ["bot_obormot.handlers"]
forbidden_modules = ["bot_obormot.app", "bot_obormot.middlewares"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Services do not depend on handlers or middlewares"
type = "forbidden"
source_modules = ["bot_obormot.services"]
forbidden_modules = ["bot_obormot.handlers", "bot_obormot.middlewares"]

[[tool.importlinter.contracts]]
name = "Config is independent of application packages"
type = "forbidden"
source_modules = ["bot_obormot.config"]
forbidden_modules = [
    "bot_obormot.app",
    "bot_obormot.handlers",
    "bot_obormot.middlewares",
    "bot_obormot.services",
    "bot_obormot.fsm",
]

[[tool.importlinter.contracts]]
name = "Errors are independent of application packages"
type = "forbidden"
source_modules = ["bot_obormot.errors"]
forbidden_modules = [
    "bot_obormot.app",
    "bot_obormot.handlers",
    "bot_obormot.middlewares",
    "bot_obormot.services",
    "bot_obormot.fsm",
]

[[tool.importlinter.contracts]]
name = "Database does not depend on LLM services"
type = "forbidden"
source_modules = ["bot_obormot.services.database"]
forbidden_modules = ["bot_obormot.services.llm"]
