name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run lint and documentation checks
        run: make lint
      - name: Run static analysis gates
        run: make types pylint deptry vulture import-lint

  test:
    name: Tests (py${{ matrix.python-version }}, ${{ matrix.deps }})
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            deps: lock
            experimental: false
          - python-version: "3.12"
            deps: lock
            experimental: false
          - python-version: "3.13"
            deps: lock
            experimental: false
          - python-version: "3.14"
            deps: lock
            experimental: false
          - python-version: "3.13"
            deps: latest
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install pinned dependencies
        if: matrix.deps == 'lock'
        run: python -m pip install -r requirements-dev.txt
      - name: Install latest allowed dependencies
        if: matrix.deps == 'latest'
        run: |
          python -m pip install -r requirements.txt \
            pytest pytest-asyncio pytest-cov \
            pytest-randomly pytest-timeout packaging defusedxml \
            hypothesis jsonschema build setuptools==84.2.1 wheel==0.48.0
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run unit tests with coverage (skips are failures)
        shell: bash
        run: |
          set -o pipefail
          make test 2>&1 | tee pytest.log
          if grep -q '^SKIPPED' pytest.log; then
            echo "::error::Unit tests must not be skipped in CI."
            exit 1
          fi
      - name: Write coverage summary
        if: matrix.deps == 'lock' && matrix.python-version == '3.12'
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.deps == 'lock' && matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
            junit.xml
          retention-days: 14

  integration:
    name: Integration
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run integration tests (skips are failures)
        shell: bash
        run: |
          set -o pipefail
          make integration 2>&1 | tee pytest.log
          if grep -q '^SKIPPED' pytest.log; then
            echo "::error::Integration tests must not be skipped in CI."
            exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Audit locked dependencies
        run: make audit

  build:
    name: Build release assets
    needs: [test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build frontend
        run: python -m pip install --disable-pip-version-check "build>=1.2,<2.0"
      - name: Build source distribution, wheel and checksums
        run: make build VERSION="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sdists=(dist/bot_obormot-*.tar.gz)
          wheels=(dist/bot_obormot-*.whl)
          [[ ${#sdists[@]} -eq 1 ]]
          [[ ${#wheels[@]} -eq 1 ]]
          test -s dist/constraints.txt
          test -s dist/SHA256SUMS
          (cd dist && sha256sum --check --status SHA256SUMS)
      - name: Check package metadata and install the wheel into a clean venv
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "twine>=6,<7"
          python -m twine check dist/bot_obormot-*.whl dist/bot_obormot-*.tar.gz
          python -m venv "${RUNNER_TEMP}/wheel-check"
          "${RUNNER_TEMP}/wheel-check/bin/python" -m pip install \
            --constraint dist/constraints.txt dist/bot_obormot-*.whl
          "${RUNNER_TEMP}/wheel-check/bin/bot-obormot" version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          retention-days: 7

  installer:
    name: Installer smoke test
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install installer smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck ffmpeg
          python -m pip install \
            --constraint requirements-lock.txt \
            -r requirements.txt \
            pytest==9.2.0 \
            pytest-asyncio==1.4.1.post1 \
            pytest-timeout==2.4.0 \
            shfmt-py==4.0.0 \
            "build>=1.2,<2.0"
      - name: Check installer shell
        run: |
          shellcheck --shell=sh install.sh
          shfmt -i 0 -d install.sh
      - name: Build source distribution, wheel and checksums
        run: make build VERSION="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sdists=(dist/bot_obormot-*.tar.gz)
          wheels=(dist/bot_obormot-*.whl)
          [[ ${#sdists[@]} -eq 1 ]]
          [[ ${#wheels[@]} -eq 1 ]]
          test -s dist/constraints.txt
          test -s dist/SHA256SUMS
          (cd dist && sha256sum --check --status SHA256SUMS)
      - name: Prepare offline installer wheelhouse
        run: |
          mkdir -p "${RUNNER_TEMP}/bot-obormot-wheelhouse"
          python -m pip download \
            --dest "${RUNNER_TEMP}/bot-obormot-wheelhouse" \
            -r requirements-lock.txt
      - name: Install and upgrade from a locally served release
        shell: bash
        run: |
          set -euo pipefail

          release_version="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          next_release_version="$(python - "$release_version" <<'PY'
          import sys

          parts = sys.argv[1].split(".")
          if not parts[-1].isdigit():
              raise SystemExit("Release version must end in a numeric component.")
          parts[-1] = str(int(parts[-1]) + 1)
          print(".".join(parts))
          PY
          )"

          pyproject_backup="${RUNNER_TEMP}/pyproject.toml"
          cp pyproject.toml "$pyproject_backup"
          server_pid=""

          cleanup() {
            result=$?
            trap - EXIT
            cp "$pyproject_backup" pyproject.toml
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            exit "$result"
          }
          trap cleanup EXIT

          release_url="http://127.0.0.1:8765"
          python -m http.server 8765 --bind 127.0.0.1 --directory dist \
            > "${RUNNER_TEMP}/release-server.log" 2>&1 &
          server_pid=$!

          attempt=0
          while [ "$attempt" -lt 30 ]; do
            attempt=$((attempt + 1))
            if curl -fsS "${release_url}/SHA256SUMS" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS "${release_url}/SHA256SUMS" >/dev/null

          user_home="${RUNNER_TEMP}/bot-obormot-user"
          app_home="${RUNNER_TEMP}/bot-obormot-app"
          mkdir -p "$user_home"

          HOME="$user_home" \
            PIP_FIND_LINKS="${RUNNER_TEMP}/bot-obormot-wheelhouse" \
            BOT_OBORMOT_HOME="$app_home" \
            BOT_OBORMOT_RELEASE_URL="$release_url" \
            BOT_OBORMOT_RELEASE_TAG="$release_version" \
            sh install.sh

          installed_version="$("$app_home/.venv/bin/python" -c 'from importlib.metadata import version; print(version("bot-obormot"))')"
          test "$installed_version" = "$release_version"
          BOT_OBORMOT_HOME="$app_home" "$app_home/.venv/bin/bot-obormot" version

          printf '%s\n' 'BOT_TOKEN=123456789:CI_INSTALLER_SMOKE_TOKEN_0123456789' \
            'SUPERVISOR_ID=1' 'CI_INSTALLER_SMOKE=preserve-me' >> "$app_home/.env"
          BOT_OBORMOT_HOME="$app_home" "$app_home/.venv/bin/bot-obormot" doctor --offline
          cp "$app_home/.env" "${RUNNER_TEMP}/bot-obormot.env"

          python - "$release_version" "$next_release_version" <<'PY'
          import sys
          from pathlib import Path

          path = Path("pyproject.toml")
          content = path.read_text(encoding="utf-8")
          old_version, new_version = sys.argv[1:]
          old_line = f'version = "{old_version}"'
          if content.count(old_line) != 1:
              raise SystemExit("Could not identify the project version in pyproject.toml.")
          path.write_text(
              content.replace(old_line, f'version = "{new_version}"', 1),
              encoding="utf-8",
          )
          PY

          bash scripts/build_release.sh "$next_release_version"

          HOME="$user_home" \
            PIP_FIND_LINKS="${RUNNER_TEMP}/bot-obormot-wheelhouse" \
            BOT_OBORMOT_HOME="$app_home" \
            BOT_OBORMOT_RELEASE_URL="$release_url" \
            BOT_OBORMOT_RELEASE_TAG="$next_release_version" \
            sh install.sh --upgrade

          installed_version="$("$app_home/.venv/bin/python" -c 'from importlib.metadata import version; print(version("bot-obormot"))')"
          test "$installed_version" = "$next_release_version"
          cmp "${RUNNER_TEMP}/bot-obormot.env" "$app_home/.env"

          cp "$pyproject_backup" pyproject.toml
          bash scripts/build_release.sh "$release_version"
      - name: Test installer flows
        env:
          PIP_FIND_LINKS: ${{ runner.temp }}/bot-obormot-wheelhouse
        run: make installer

  docker:
    name: Docker image smoke test
    needs: [test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create Compose environment file
        run: touch .env
      - name: Validate Compose configuration and build Docker image
        run: make docker
      - name: Run version and offline doctor in the image
        run: |
          set -euo pipefail
          docker compose -f compose.yaml run --rm --no-deps \
            --env BOT_TOKEN=123456789:CI_DOCKER_SMOKE_TOKEN_0123456789012 \
            --env SUPERVISOR_ID=1 \
            bot-obormot bot-obormot version
          docker compose -f compose.yaml run --rm --no-deps \
            --env BOT_TOKEN=123456789:CI_DOCKER_SMOKE_TOKEN_0123456789012 \
            --env SUPERVISOR_ID=1 \
            bot-obormot bot-obormot doctor --offline
          docker compose -f compose.yaml down --volumes
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
      - name: Build and publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          docker build --pull \
            --tag "${image}:${GITHUB_SHA}" \
            --tag "${image}:latest" \
            .
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"
