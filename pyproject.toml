[project]
name = "bot-obormot"
version = "0.1.1"
requires-python = ">=3.11"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["data", "tmp", "models"]
namespace-packages = ["scripts", "tests/contract"]

[tool.ruff.lint]
select = ["ALL"]
# Cyrillic letters that look like Latin ones. User-facing texts, docstrings and
# comments of this project are written in Russian, so these are legitimate.
allowed-confusables = ["×", "А", "В", "Е", "К", "Н", "О", "С", "У", "а", "б", "г", "е", "о", "р", "с", "у", "х", "ℹ"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "TD002",
    "TD003",
    "FIX002",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 40
max-branches = 12

[tool.ruff.lint.per-file-ignores]
# Rules that stay off for the test suite on purpose:
# S101 - pytest tests are written with plain asserts;
# PLR2004 - assertions compare against literal expected values;
# SLF001 - white-box tests read private members of the code under test.
"tests/*" = [
    "PLR2004",
    "S101",
    "SLF001",
]

[tool.coverage.run]
branch = true
source = ["bot"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 81
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '\.\.\.',
]
